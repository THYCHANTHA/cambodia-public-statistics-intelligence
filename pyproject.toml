[project]
name = "cambodia-public-statistics-intelligence"
version = "0.1.0"
description = "Integrated national and ASEAN development data observatory built on World Bank WDI data"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "pyyaml",
    "pandas",
    "pyarrow",
    "duckdb",
    "scipy",
    "plotly",
    "streamlit",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: needs the live World Bank API (deselect with -m 'not integration')"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]
"tests/*" = ["E501"]
"app/*" = ["E501"]
